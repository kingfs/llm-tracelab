name: Go CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install Go dependencies
      run: go mod download

    - name: Install UI dependencies
      working-directory: web/monitor-ui
      run: bun install --frozen-lockfile

    - name: Build Trace Monitor UI
      working-directory: web/monitor-ui
      run: bun run build

    - name: Build
      run: go build -v -o llm-tracelab ./cmd/server

    - name: Check Go formatting
      run: |
        unformatted="$(gofmt -l ./cmd ./internal ./pkg ./unittest ./web/monitor-ui/test-fixtures)"
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.11.4

    - name: Test
      run: go test -v ./...

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Validate ATIF v1.8 export
      run: |
        python -m pip install -r scripts/atif-requirements.txt
        python -m unittest discover -s scripts/atif_tests
        ATIF_TEST_OUTPUT_DIR="$RUNNER_TEMP" go test ./internal/trajectory -run TestBuildCumulativeHistoryAndHumanCorrection -count=1
        python scripts/validate_atif.py "$RUNNER_TEMP/session.jsonl"

    - name: Install Playwright Chromium
      working-directory: web/monitor-ui
      run: bunx playwright install --with-deps chromium

    - name: Monitor UI smoke tests
      working-directory: web/monitor-ui
      run: bun run test:ui

    - name: Monitor UI real-server tests
      working-directory: web/monitor-ui
      run: bun run test:ui:real

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: llm-tracelab-linux-amd64
        path: llm-tracelab

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 自动生成 tags（latest / sha / version tag）
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/llm-tracelab
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha
          type=ref,event=tag

    - name: Build and push multi-arch
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
