server:
  port: "8080"

monitor:
  port: "8081"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "./logs/local"

# The local Responses execution mode is always available; to opt out of local
# translation, set responses_strategy to "native_only" in the Monitor Routing
# settings (application DB app_settings key "routing.settings", not a YAML key).
responses_server:
  default_model: "gpt-4o-mini"
  force_store: false
  path: "/v1/responses"

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m
  selection:
    policy: "p2c"
    epsilon: 0.02
    open_window: 15s
    failure_threshold: 3
  fallback:
    on_missing_model: "reject"

upstreams:
  - id: "local"
    enabled: true
    priority: 100
    weight: 1.0
    capacity_hint: 1.0
    model_discovery: "static_only"
    static_models:
      - "gpt-4o-mini"
    upstream:
      base_url: "https://api.openai.com/v1"
      api_key: "$env:OPENAI_API_KEY"
      provider_preset: "openai"
      api_type: "chat_completions"
      mode: "proxy"
      capabilities:
        chat_completions: true
        responses: true
        tool_calling: true
        models: true
      # Optional per-model overrides. A model listed here uses these capability
      # flags instead of the ones above, which is what lets one upstream serve
      # some models natively and route others through the local Responses mode.
      # Unlisted models keep the upstream-level capabilities.
      # model_capabilities:
      #   gpt-4o-mini:
      #     responses: true
      #     chat_completions: false
      #   gpt-4o-mini-chat:
      #     responses: false
      #     chat_completions: true
      protocol_family: "openai_compatible"
      routing_profile: "openai_default"
      headers: {}

debug:
  output_dir: "./logs/local"
  mask_key: true

chaos:
  enabled: false
  rules: []
