server:
  port: "8080"

monitor:
  port: "8081"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "postgres"
  dsn: ""
  max_open_conns: 16
  max_idle_conns: 8
  auto_migrate: true

trace:
  output_dir: "./data/traces"

responses_server:
  enabled: true
  default_model: ""
  force_store: true
  max_request_body_bytes: 10485760
  path: "/v1/responses"
  auto_compact: true
  compact_history_item_threshold: 80
  adopt_channel_model_profiles: true
  function_executors:
    enabled: false
    timeout: 2s
    max_result_bytes: 65536
    redaction:
      arguments: true
      output: true
    executors: []

tools:
  web_search:
    enabled: false
    provider: "searxng"
    max_results: 5
    base_url: "http://searxng:8080"
    timeout_ms: 5000
    user_agent: "llm-tracelab/production"

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m
    startup_policy: "best_effort"
  selection:
    policy: "p2c"
    epsilon: 0.02
    open_window: 15s
    failure_threshold: 3
  fallback:
    on_missing_model: "reject"

debug:
  output_dir: "./data/traces"
  mask_key: true

chaos:
  enabled: false
  rules: []
